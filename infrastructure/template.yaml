Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    Tracing: Active

Resources:

  # ─────────────────────────────────────────
  # BUCKETS S3 — Data Lake
  # ─────────────────────────────────────────

  RawDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-raw-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: alias/aws/s3
      PublicAccessBlockConfiguration:
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  RawDataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RawDataBucket
      PolicyDocument:
        Id: RequireEncryptionInTransit
        Version: '2012-10-17'
        Statement:
          - Principal: '*'
            Action: '*'
            Effect: Deny
            Resource:
              - !GetAtt RawDataBucket.Arn
              - !Sub ${RawDataBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  ProcessedDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-processed-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: alias/aws/s3
      PublicAccessBlockConfiguration:
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ProcessedDataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProcessedDataBucket
      PolicyDocument:
        Id: RequireEncryptionInTransit
        Version: '2012-10-17'
        Statement:
          - Principal: '*'
            Action: '*'
            Effect: Deny
            Resource:
              - !GetAtt ProcessedDataBucket.Arn
              - !Sub ${ProcessedDataBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-output-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: alias/aws/s3
      PublicAccessBlockConfiguration:
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OutputBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OutputBucket
      PolicyDocument:
        Id: RequireEncryptionInTransit
        Version: '2012-10-17'
        Statement:
          - Principal: '*'
            Action: '*'
            Effect: Deny
            Resource:
              - !GetAtt OutputBucket.Arn
              - !Sub ${OutputBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ─────────────────────────────────────────
  # DYNAMODB — Tabla de predicciones
  # ─────────────────────────────────────────

  PrediccionesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PrediccionesTable
      AttributeDefinitions:
        - AttributeName: StoreId
          AttributeType: S
        - AttributeName: Fecha
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: StoreId
          KeyType: HASH
        - AttributeName: Fecha
          KeyType: RANGE

  # ─────────────────────────────────────────
  # LAMBDA ETL — Limpieza y carga de datos
  # ─────────────────────────────────────────

  LambdaETL:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-LambdaETL
      Description: Limpia y transforma los datos raw de Rossmann y los carga en S3 processed
      CodeUri: src/etl/
      Handler: lambda_function.lambda_handler
      MemorySize: 512
      Timeout: 300
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Events:
        S3Trigger:
          Type: S3
          Properties:
            Bucket: !Ref RawDataBucket
            Events:
              - s3:ObjectCreated:*
      Environment:
        Variables:
          RAW_BUCKET: !Ref RawDataBucket
          PROCESSED_BUCKET: !Ref ProcessedDataBucket
          TABLE_NAME: !Ref PrediccionesTable

  LambdaETLLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${LambdaETL}
      RetentionInDays: 7

  # ─────────────────────────────────────────
  # LAMBDA INFERENCIA — Predicciones
  # ─────────────────────────────────────────

  LambdaInferencia:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-LambdaInferencia
      Description: Recibe peticiones del API Gateway, llama a SageMaker y guarda predicciones
      CodeUri: src/inferencia/
      Handler: lambda_function.lambda_handler
      MemorySize: 512
      Timeout: 30
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      Events:
        ApiPOST:
          Type: Api
          Properties:
            Path: /prediccion
            Method: POST
            RestApiId: !Ref ApiGateway
        ApiGET:
          Type: Api
          Properties:
            Path: /predicciones/{store_id}
            Method: GET
            RestApiId: !Ref ApiGateway
      Environment:
        Variables:
          TABLE_NAME: !Ref PrediccionesTable
          SAGEMAKER_ENDPOINT: prediccion-demanda-endpoint
          OUTPUT_BUCKET: !Ref OutputBucket

  LambdaInferenciaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${LambdaInferencia}
      RetentionInDays: 7

  # ─────────────────────────────────────────
  # API GATEWAY — Exposicion REST API
  # ─────────────────────────────────────────

  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub ${AWS::StackName}-ApiGateway
      StageName: Prod
      DefinitionBody:
        openapi: '3.0'
        info: {}
        paths:
          /prediccion:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaInferencia.Arn}/invocations
              responses: {}
          /predicciones/{store_id}:
            get:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaInferencia.Arn}/invocations
              responses: {}
      EndpointConfiguration: REGIONAL
      TracingEnabled: true

  # ─────────────────────────────────────────
  # EVENTBRIDGE — Reentrenamiento semanal
  # Desactivado para conservar creditos en Academy
  # ─────────────────────────────────────────

  ReentrenamientoSemanal:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${AWS::StackName}-ReentrenamientoSemanal
      Description: Lanza el ETL cada lunes a las 6AM hora Madrid. DISABLED en entorno de pruebas.
      ScheduleExpression: cron(0 6 ? * MON *)
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpressionTimezone: Europe/Madrid
      State: DISABLED
      Target:
        Arn: !GetAtt LambdaETL.Arn
        RoleArn: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
